name: Bootstrap foundation

on:
  push:
    paths:
      - project.tar.gz.b64

permissions:
  contents: write

jobs:
  unpack:
    if: github.event.head_commit.message != 'feat: bootstrap Internal Task Management foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project source
        shell: bash
        run: |
          base64 -d project.tar.gz.b64 > /tmp/project.tar.gz
          tar -xzf /tmp/project.tar.gz -C .
          rm project.tar.gz.b64
      - name: Commit unpacked source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: bootstrap Internal Task Management foundation"
          git push
