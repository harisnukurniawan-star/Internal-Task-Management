name: Unpack foundation

on: [push]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack foundation source
        shell: bash
        run: |
          if [ ! -f project.tar.gz.b64 ]; then
            echo "Foundation already unpacked"
            exit 0
          fi
          base64 -d project.tar.gz.b64 > /tmp/project.tar.gz
          tar -xzf /tmp/project.tar.gz -C .
          rm project.tar.gz.b64 bootstrap.cjs
      - name: Commit source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "bootstrap foundation source"
          git push
